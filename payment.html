<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MINE MC | Payment</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                radial-gradient(
                    circle at top,
                    rgba(255, 121, 0, 0.15),
                    transparent 40%
                ),
                #050505;

            color: white;

            font-family: Arial, Helvetica, sans-serif;
        }

        .payment-box {
            width: 100%;
            max-width: 480px;

            padding: 30px;

            background: rgba(15, 15, 15, 0.92);

            border: 1px solid rgba(255, 121, 0, 0.25);

            border-radius: 18px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55);

            text-align: center;
        }

        .logo {
            font-size: 25px;
            font-weight: 1000;
            letter-spacing: 2px;

            margin-bottom: 8px;
        }

        .logo span {
            color: #ff7900;
        }

        .subtitle {
            color: #888;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .product-name {
            color: #ff7900;

            font-size: 13px;
            font-weight: 900;

            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        h1 {
            margin-top: 8px;

            font-size: 30px;
        }

        .price {
            margin: 12px 0 25px;

            font-size: 34px;
            font-weight: 1000;
        }

        .qr-box {
            width: 230px;
            height: 230px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;

            border-radius: 12px;

            overflow: hidden;
        }

        .qr-box img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        .upi {
            padding: 13px;

            margin-bottom: 22px;

            background: rgba(255, 121, 0, 0.08);

            border: 1px solid rgba(255, 121, 0, 0.18);

            border-radius: 8px;

            color: #ddd;

            font-size: 13px;
        }

        .upi strong {
            color: #ff7900;
        }

        .instruction {
            color: #888;

            font-size: 12px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .field {
            text-align: left;

            margin-bottom: 15px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            color: #aaa;

            font-size: 12px;
            font-weight: 700;
        }

        .field input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid rgba(255,255,255,0.10);

            border-radius: 8px;

            outline: none;

            background: rgba(255,255,255,0.04);

            color: white;

            font-size: 14px;
        }

        .field input:focus {
            border-color: #ff7900;
        }

        .submit-btn {
            width: 100%;

            margin-top: 8px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #ff7900;

            color: white;

            cursor: pointer;

            font-size: 13px;
            font-weight: 1000;

            transition: 0.2s;
        }

        .submit-btn:hover {
            background: #ff8d24;
            transform: translateY(-2px);
        }

        .back {
            display: inline-block;

            margin-top: 20px;

            color: #777;

            font-size: 12px;
        }

        .back:hover {
            color: #ff7900;
        }
    </style>
</head>

<body>

    <div class="payment-box">

        <div class="logo">
            MINE <span>MC</span>
        </div>

        <div class="subtitle">
            Secure UPI Payment
        </div>

        <div class="product-name" id="productName">
            MINE MC PRODUCT
        </div>

        <h1>
            Complete Payment
        </h1>

        <div class="price" id="productPrice">
            ₹0
        </div>


        <div class="qr-box">

            <img
                src="qr.png"
                alt="MINE MC UPI QR"
            >
                
        </div>


        <div class="upi">
            Pay to:
            <strong>
                6207867258@fam
            </strong>
        </div>


        <div class="instruction">
            QR scan karke exact amount pay karein.
            Payment complete hone ke baad neeche
            Minecraft username aur UTR / Transaction ID enter karein.
        </div>


        <form id="paymentForm">

            <div class="field">

                <label>
                    Minecraft Username
                </label>

                <input
                    type="text"
                    id="minecraftUsername"
                    placeholder="Your Minecraft username"
                    required
                >

            </div>


            <div class="field">

                <label>
                    UTR / Transaction ID
                </label>

                <input
                    type="text"
                    id="utr"
                    placeholder="Enter payment UTR"
                    required
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                SUBMIT PAYMENT
            </button>

        </form>


        <a
            href="index.html"
            class="back"
        >
            ← Back to Store
        </a>

    </div>


    <script>

        const params =
            new URLSearchParams(window.location.search);

        const product =
            params.get("product");

        const price =
            params.get("price");


        if (product) {
            document.getElementById(
                "productName"
            ).textContent = product;
        }


        if (price) {
            document.getElementById(
                "productPrice"
            ).textContent = "₹" + price;
        }


        document
            .getElementById("paymentForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const username =
                    document.getElementById(
                        "minecraftUsername"
                    ).value.trim();

                const utr =
                    document.getElementById(
                        "utr"
                    ).value.trim();


                if (!username || !utr) {
                    alert(
                        "Please enter Minecraft username and UTR."
                    );

                    return;
                }


                alert(
                    "Payment details submitted!\n\n" +
                    "Automatic verification system will be connected next."
                );

            });

    </script>

</body>
</html>
